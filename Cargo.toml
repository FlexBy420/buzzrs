[package]
name = "buzzrs"
version = "0.1.0"
edition = "2021"
description = "Phones as Buzz! buzzers: a web controller and an emulated USB Buzz! dongle for PS3 and RPCS3"
license = "MIT"
readme = "README.md"
keywords = ["buzz", "ps3", "rpcs3", "usb-gadget", "hid"]
categories = ["games", "hardware-support"]

[dependencies]
anyhow = "1"
libc = "0.2"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
strip = true
