<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buzzrs host</title>
<style>
  :root { --bg: #111317; --card: #1b1e24; --line: #2c3038; --ink: #f2f3f5; --muted: #8b90a0; --accent: #f6b51e;
    --red: #e3242b; --blue: #2f7df6; --orange: #ff8a1f; --green: #2fbf5b; --yellow: #ffd400; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 26px; }
  h1 span { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .join { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
  .qr { background: #fff; border-radius: 12px; padding: 8px; width: 216px; height: 216px; }
  .qr img { width: 100%; height: 100%; display: block; }
  .url { font: 700 22px/1.3 ui-monospace, monospace; color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); font-weight: 600; }
  .badge .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; }
  .badge.ok .dot { background: #2fbf5b; }
  .sets { display: grid; gap: 18px; }
  .sets h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .buzzer { background: #15171c; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; justify-items: center; opacity: .5; }
  .buzzer.on { opacity: 1; }
  .buzzer h3 { margin: 0; font-size: 15px; }
  .dome { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #ff8a8f 0 8%, #c51c22 40%, #6f0a0f 100%); }
  .dome.lit { box-shadow: 0 0 22px 8px rgba(255,60,60,.7); filter: brightness(1.4); }
  .dome.down { outline: 4px solid #fff; }
  .keys { display: grid; gap: 5px; width: 100%; }
  .key { height: 14px; border-radius: 5px; opacity: .35; }
  .key.down { opacity: 1; outline: 2px solid #fff; }
  .blue { background: var(--blue); } .orange { background: var(--orange); } .green { background: var(--green); } .yellow { background: var(--yellow); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .quit { text-decoration: none; }
  button.quit, a.quit { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }
  ol { margin: 6px 0 0; padding-left: 20px; }
  @media (max-width: 640px) { .join { grid-template-columns: 1fr; justify-items: center; text-align: center; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main>
  <div class="row"><h1>buzz<span>rs</span></h1><div class="row"><span class="badge" id="dev"><span class="dot"></span><span id="devText">…</span></span><a class="quit" href="/test" target="_blank" title="All buzzers in this browser, without phones">Test</a><button class="quit" id="quit">Quit</button></div></div>
  <section class="card join">
    <div class="qr"><img src="/qr.svg" alt="QR code"></div>
    <div>
      <div class="muted">Scan the code or open this address on the phones (same Wi-Fi):</div>
      <div class="url" id="url">…</div>
      <ol class="muted">
        <li>Each phone becomes the next free buzzer (<span id="range">1-4</span>).</li>
        <li>The red light of a buzzer lights up here and on its phone when the game turns it on.</li>
      </ol>
    </div>
  </section>
  <section class="card sets" id="sets"></section>
</main>
<script>
"use strict";
const sets = document.getElementById("sets");
let cells = [];
const colours = ["blue", "orange", "green", "yellow"];
// report bit order: red 0, yellow 1, green 2, orange 3, blue 4
const bit = { red: 0, yellow: 1, green: 2, orange: 3, blue: 4 };
let first = 1, builtFirst = 0;
function build(players) {
  if (cells.length === players && builtFirst === first) return;
  builtFirst = first;
  sets.replaceChildren();
  cells = [];
  for (let s = 0; s < players / 4; s++) {
    const box = document.createElement("div");
    const set = Math.ceil((first + s * 4) / 4);
    box.innerHTML = players > 4 || first > 1 ? `<h2>Set ${set}</h2>` : "";
    const grid = document.createElement("div");
    grid.className = "grid";
    box.append(grid);
    sets.append(box);
    for (let i = 0; i < 4; i++) {
      const n = first + s * 4 + i;
      const el = document.createElement("div");
      el.className = "buzzer";
      el.innerHTML = `<h3>Buzzer ${n}</h3><div class="dome"></div><div class="keys">${colours.map(c => `<div class="key ${c}"></div>`).join("")}</div><div class="muted state">free</div>`;
      grid.append(el);
      cells.push(el);
    }
  }
  document.getElementById("range").textContent = `${first}-${first + players - 1}`;
}
build(4);
function status(m) {
  build(m.taken.length);
  cells.forEach((el, i) => {
    const b = (m.buttons || [])[i] || 0;
    el.classList.toggle("on", !!m.taken[i]);
    el.querySelector(".state").textContent = m.taken[i] ? "phone connected" : "free";
    const dome = el.querySelector(".dome");
    dome.classList.toggle("lit", !!m.lights[i]);
    dome.classList.toggle("down", !!(b & 1 << bit.red));
    el.querySelectorAll(".key").forEach((k, j) => k.classList.toggle("down", !!(b & 1 << bit[colours[j]])));
  });
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?host=1`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "host") {
      document.getElementById("url").textContent = m.url;
      first = m.first || 1;
      build(m.players || 4);
      document.getElementById("devText").textContent = m.device;
      document.getElementById("dev").classList.toggle("ok", m.device.startsWith("USB"));
    } else if (m.t === "status") status(m);
  };
  ws.onclose = () => { document.getElementById("devText").textContent = "buzzrs is not running"; document.getElementById("dev").classList.remove("ok"); setTimeout(connect, 2000); };
}
document.getElementById("quit").onclick = async () => {
  if (!confirm("Stop buzzrs? The phones lose their buzzers.")) return;
  await fetch("/quit", { method: "POST" }).catch(() => {});
};
connect();
</script>
</body>
</html>
